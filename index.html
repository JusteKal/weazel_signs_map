<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weazel Signs Map</title>
    <link rel="shortcut icon" href="assets/signsmapico.svg" type="svg/xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Weazel Signs Map</h1>
            <div class="header-controls">
                <div class="filter-btns">
                    <button class="btn btn-filter active" data-filter="all">Tous</button>
                    <button class="btn btn-filter" data-filter="grand">Grand</button>
                    <button class="btn btn-filter" data-filter="medium">Medium</button>
                    <button class="btn btn-filter" data-filter="petit">Petit</button>
                    <button class="btn btn-filter" data-filter="mur">Mur</button>
                </div>
                <span class="zoom-info">Zoom: <span id="zoomLevel">100</span>%</span>
            </div>
        </header>

        <!-- Main content -->
        <div class="content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Points</h2>
                    <span class="point-count" id="pointCount">0</span>
                </div>
                <div class="sidebar-content" id="pointsList">
                    <p class="empty-state">Aucun point disponible</p>
                </div>
            </aside>

            <!-- Map container -->
            <main class="map-container">
                <div class="map-viewport" id="mapViewport">
                    <div class="map-canvas" id="mapCanvas">
                        <svg class="map-svg" id="mapSvg" viewBox="0 0 8192 8192" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges">
                            <use href="#img1" x="0" y="0" width="8192" height="8192"/>
                            <g id="markersGroup"></g>
                        </svg>
                    </div>
                </div>

                <!-- Coord tracker -->
                <div class="coord-tracker" id="coordTracker">
                    <span class="coord-status" id="coordStatus">libre</span>
                    <span class="coord-label">X: <strong id="cursorX">—</strong> &nbsp; Y: <strong id="cursorY">—</strong></span>
                    <button class="btn-copy" id="copyCoordBtn" title="Copier le JSON du point">📋 Copier JSON</button>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for viewing point details -->
    <div class="modal" id="viewPointModal">
        <div class="modal-content modal-view">
            <div class="modal-header">
                <h2 id="viewPointTitle"></h2>
                <button class="close-btn" id="closeViewModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="viewPointImage" class="view-image"></div>
                <div id="viewPointDescription" class="view-description"></div>
                <div id="viewPointCoords" class="view-coords"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="closeViewBtn">Fermer</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
